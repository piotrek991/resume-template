# Site settings
title: "Piotr Szewczul — CV"
description: "Data Engineer · ETL Engineer · Python Developer. GCP, BigQuery, PostgreSQL, Python, Kubernetes."
url: "https://piotrek991.github.io"
baseurl: "/resume-template"
lang: en

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Excluded from the built site
exclude:
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - LICENSE
  - _vendor
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - .dockerignore
  - vendor

# ---------------------------------------------------------------------------
# Resume settings (language-independent).
# Translatable text lives in _data/<lang>/meta.yml, content in _data/<lang>/*.yml
# ---------------------------------------------------------------------------
author:
  name: "Piotr Szewczul"
  email: "piotrek.szewczul19@gmail.com"
  phone: "+48 511 111 369"
  avatar: "/images/avatar.webp"
  avatar_fallback: "/images/avatar.png"
  github: "https://github.com/piotrek991"
  linkedin: "https://www.linkedin.com/in/piotr-szewczul-70891720b/"

# Show the "open to work" badge
