resume_header_intro: "<p>Data & IT Specialist. Three years of hands-on experience in the Data industry, with a focus on efficiency and technical excellence. I excel at learning on the fly and staying composed under pressure. I am a proactive individual who is deeply committed to lifelong learning, always seeking new challenges to further refine my expertise and become a better Engineer every day.</p>"
resume_header_intro_pl: "<p>Specjalista Data & IT. Ponad Trzy lata praktycznego doświadczenia w branży Data, z silnym nastawieniem na wydajność i doskonalenie techniczne. Skutecznie uczę się w biegu i zachowuję spokój pod presją czasu. Jestem osobą proaktywną, oddaną idei ciągłego kształcenia , która zawsze szuka nowych wyzwań, aby doskonalić swoją wiedzę i każdego dnia stawać się lepszym inżynierem.</p>"

resume_looking_for_work:        "yes"

resume_section_experience:      true
