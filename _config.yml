# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Piotr Szewczul"
resume_title:                   "Data Engineer \t|\t ETL Engineer \t|\t Python Developer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "piotrek.szewczul19@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "511 111 369"
resume_contact_address:         "742 Evergreen Terrace, Springfield"

resume_header_contact_info:     "piotrek.szewczul19@gmail.com \t|\t +48 511 111 369"
