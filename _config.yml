resume_header_intro: "<p>Data & IT Specialist with over three years of experience in building and optimizing data ecosystems. I specialize in bridging the gap between data engineering and process automation, maintaining composure and efficiency under pressure. I successfully deployed an enterprise-grade DataHub platform, integrating object metadata from multiple internal banking systems. Additionally, I implemented a BigQuery cost allocation mechanism, enabling precise cloud expenditure accounting across business units. As a proactive professional committed to continuous growth, I effectively adapt to new technologies to deliver tangible business value.</p>"
resume_header_intro_pl: "<p>Specjalista Data & IT z ponad trzyletnim doświadczeniem w budowaniu i optymalizacji ekosystemów danych. Specjalizuję się w łączeniu inżynierii danych z automatyzacją procesów, zachowując spokój i efektywność pod presją czasu. Pomyślnie wdrożyłem korporacyjną platformę DataHub, integrując ją z metadanymi obiektów z wielu wewnętrznych systemów bankowych. Zaimplementowałem mechanizm alokacji kosztów w BigQuery umożliwiający precyzyjne rozliczanie wydatków chmurowych jednostek biznesowych. Jako osoba proaktywna i nastawiona na ciągły rozwój, skutecznie adaptuję nowe technologie, by dostarczać realną wartość biznesową.</p>"

