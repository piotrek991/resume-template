<section class="content-section" aria-labelledby="sec-education">
  <header class="section-header"><h2 id="sec-education">{{ L.education }}</h2></header>
  {% for e in d.education %}
  <article class="resume-item">
    <div class="item-head">
      <div>
        <h3 class="resume-item-title">{{ e.school }}</h3>
        <p class="resume-item-details">{{ e.degree }}</p>
      </div>
      <p class="item-dates">{{ e.years }}</p>
    </div>
    <ul class="bullets">
      {% for b in e.bullets %}<li>{{ b }}</li>{% endfor %}
    </ul>
  </article>
  {% endfor %}
</section>
