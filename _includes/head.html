<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
  <link rel="alternate" hreflang="pl" href="{{ '/pl/' | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "jobTitle": {{ d.meta.title | jsonify }},
    "email": {{ site.author.email | prepend: 'mailto:' | jsonify }},
    {% if site.author.phone %}"telephone": {{ site.author.phone | jsonify }},{% endif %}
    "image": {{ site.author.avatar_fallback | absolute_url | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "sameAs": [{{ site.author.github | jsonify }}, {{ site.author.linkedin | jsonify }}],
    "worksFor": { "@type": "Organization", "name": {{ d.experience.first.company | jsonify }} },
    "alumniOf": [{% for e in d.education %}{ "@type": "CollegeOrUniversity", "name": {{ e.school | jsonify }} }{% unless forloop.last %}, {% endunless %}{% endfor %}],
    "knowsAbout": {{ d.skills.core | jsonify }}
  }
  </script>
</head>
