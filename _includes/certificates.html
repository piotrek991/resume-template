<section class="content-section" aria-labelledby="sec-certificates">
  <header class="section-header"><h2 id="sec-certificates">{{ L.certificates }}</h2></header>
  {%- comment -%} Plain two-column list: name, then issuer · code (no dates); each name links to verification. {%- endcomment -%}
  <ul class="cert-list">
    {% for c in d.certificates %}
    <li>
      <a class="cert-name" href="{{ c.url }}" title="{{ L.verify }}: {{ c.name }}">{{ c.name }}</a>
      <span class="cert-issuer">{{ c.issuer }}{% if c.code %} · {{ c.code }}{% endif %}</span>
    </li>
    {% endfor %}
  </ul>
</section>
