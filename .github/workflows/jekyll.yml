# Build the Jekyll CV, render PDF versions with headless Chrome, deploy to GitHub Pages.
name: Deploy CV to Pages

on:
  push:
    branches: ["gh-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel in-progress production deploys.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 1

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render PDFs
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          # Serve _site under the same base path it was built for, so CSS/images resolve.
          mkdir -p /tmp/srv
          if [ -n "$BASE" ]; then ln -s "$PWD/_site" "/tmp/srv$BASE"; else rmdir /tmp/srv && ln -s "$PWD/_site" /tmp/srv; fi
          python3 -m http.server 8080 --directory /tmp/srv >/dev/null 2>&1 &
          sleep 2
          root="http://localhost:8080$BASE"
          for pair in "en:/" "pl:/pl/"; do
            lang="${pair%%:*}"; path="${pair#*:}"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --virtual-time-budget=5000 \
              --print-to-pdf="$PWD/_site/cv-$lang.pdf" "$root$path?print"
          done
          ls -la _site/*.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
