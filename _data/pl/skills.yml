      - name: "Terraform · Nginx"
        detail: "Deklaracje zasobów; reverse / sidecar proxy."
      - name: "AutomateNow"
        detail: "Workflowy codziennego przetwarzania danych."

  - name: "Analityka i BI"
    items:
      - name: "Apache Superset"
        detail: "Dashboardy, wykresy, datasety, automatyzacja wdrożeń."
