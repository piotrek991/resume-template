# Doświadczenie zawodowe — od najnowszego.
# Pola: company, position, start, end, intro, tech (lista), highlights (title, summary, bullets)
# Najmocniejsze obszary na początku — rekruter często czyta tylko pierwszy lub dwa.
- company: "PKO Bank Polski S.A."
  position: "ETL Developer | Data Engineer"
  start: "06.2024"
  end: "Obecnie"
  intro: >-
    Hurtownia danych, framework zasilający, platforma metadanych i automatyzacja procesów na GCP;
    projekty wprowadzające nowe technologie (DataHub, LDAP).
  tech: [BigQuery, GKE, PostgreSQL, Python, DataHub, Kafka, Elasticsearch, Helm, Docker, GitLab CI/CD, Ansible, Apache Superset, Terraform, Flask, Nginx]
  highlights:
    - title: "Rozwój platformy DataHub"
      summary: "Współtworzenie korporacyjnej platformy metadanych integrującej 4 systemy wewnętrzne i ponad 10 000 obiektów."
      bullets:
        - "Budowa data lineage między obiektami na podstawie procedur BigQuery/Oracle i workflowów Informatica."
        - "Automatyzacja tworzenia Structured Properties, tagów, słowników biznesowych i domen."
        - "Wdrożenia na GKE przy użyciu Helm Chartów i własnych, zabezpieczonych obrazów Docker."
        - "Optymalizacja wydajności: partycjonowanie topiców Kafka, sharding indeksów Elasticsearch, konfiguracja środowiska."
        - "Nginx jako sidecar proxy frontendu, naprawiający błędy wyszukiwania przez modyfikację wybranych zapytań API."
        - "Strona we Flasku z bezpośrednim dostępem do dokumentacji obiektów z UI DataHub oraz workflow GitLab CI/CD konwertujący dokumentację Excel do HTML."
    - title: "Hurtownia danych i alokacja kosztów"
      summary: "Rozliczanie kosztów BigQuery dla wszystkich departamentów korzystających z platformy GCP BigQuery w banku."
      bullets:
        - "Zautomatyzowany proces alokacji kosztów storage i compute BigQuery na departamenty, łączący członkostwo w grupach LDAP/IAM z metadanymi BigQuery."
        - "Dashboard w Apache Superset dający jednostkom biznesowym wgląd w wydatki chmurowe."
        - "Utrzymanie struktur hurtowni danych w BigQuery oraz zasilanie metadanych dla wewnętrznego frameworka automatyzującego przetwarzanie plików."
    - title: "Framework zasilający dane (PostgreSQL)"
      summary: "Triggery, procedury i funkcje zarządzające metadanymi procesów."
      bullets:
        - "Refaktoryzacja i optymalizacja kluczowych procedur i funkcji — wybrane kroki przetwarzania nawet 10x szybsze."
        - "Triggery audytowe na tabelach wymiarów, logujące operacje INSERT, UPDATE i DELETE."
        - "Triggery po załadowaniu danych, wyliczające daty kolejnych uruchomień i weryfikujące zależności procesów."
    - title: "Automatyzacja procesów (Python)"
      summary: "Narzędzia i samodzielne pliki binarne dla wewnętrznych workflowów."
      bullets:
        - "Automatyczne wdrażanie wykresów i dashboardów Superset przez REST API."
        - "Eksport grup z LDAP do mapowania grup GCP IAM; monitoring wygasania kluczy kont serwisowych z alertami e-mail."
        - "Parser deklaracji obiektów GCP z Terraform do PostgreSQL; konwerter Excel→HTML do bucketów GCS."
    - title: "Apache Superset"
      summary: "Przeprowadzenie aktualizacji platformy."
      bullets:
        - "Zadania Ansible do wdrażania dashboardów i aktualizacja definicji wdrożeniowych pod nowsze wersje."
        - "Budowa dashboardów, wykresów i datasetów."

