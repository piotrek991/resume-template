# Doświadczenie zawodowe — od najnowszego.
# Pola: company, position, start, end, intro, tech (lista), highlights (title, summary, bullets)
- company: "PKO Bank Polski S.A."
  position: "ETL Developer | Data Engineer"
  start: "06.2024"
  end: "Obecnie"
  intro: >-
    W PKO szybko zdobyłem zaufanie współpracowników. Często trafiam do projektów wykorzystujących nowe
    technologie, takie jak LDAP czy DataHub, gdzie muszę szybko opanować ich obsługę, aby skutecznie realizować zadania.
  tech: [BigQuery, PostgreSQL, Python, DataHub, Kafka, Elasticsearch, GKE, Helm, Docker, Ansible, Apache Superset, Terraform, GitLab CI]
  highlights:
    - title: "Architektura i hurtownia danych"
      summary: "Utrzymywanie struktur hurtowni danych w BigQuery."
      bullets:
        - "Zautomatyzowany proces alokacji kosztów przechowywania i przetwarzania danych w BigQuery na departamenty — integracja danych z LDAP (członkostwo w grupach IAM) z wewnętrznymi metadanymi BQ. Dashboard w Apache Superset do wizualizacji metryk."
        - "Budowa zasilania metadanych dla wewnętrznego frameworka automatyzującego przetwarzanie plików danych."
    - title: "Rozwój frameworka zasilającego dane"
      summary: "Triggery, procedury i funkcje zarządzające metadanymi procesów w PostgreSQL."
      bullets:
        - "Triggery na tabelach wymiarów logujące szczegółowe zmiany (insert/update/delete) na potrzeby audytu."
        - "Triggery obsługujące powiadomienia po załadowaniu danych, w tym wyliczanie dat kolejnych uruchomień i weryfikację zależności procesów."
        - "Refaktoryzacja i optymalizacja kluczowych procedur oraz funkcji frameworka w celu poprawy wydajności."
    - title: "Automatyzacja procesów wewnętrznych"
      summary: "Narzędzia w Pythonie i pliki binarne automatyzujące wewnętrzne procesy."
      bullets:
        - "Narzędzie automatyzujące wdrażanie wykresów i dashboardów w Apache Superset przez API."
        - "Skrypt pobierający członków grup z wewnętrznego LDAP na potrzeby mapowania grup GCP IAM."
        - "Narzędzie monitorujące daty wygaśnięcia kluczy kont serwisowych z automatycznymi powiadomieniami e-mail."
        - "Parser deklaracji obiektów GCP w Terraform synchronizujący dane z bazą PostgreSQL."
        - "Narzędzie konwertujące arkusze Excel do HTML i wysyłające je do bucketów GCP."
    - title: "Rozwój platformy DataHub"
      summary: "Udział w budowie korporacyjnej platformy metadanych."
      bullets:
        - "Automatyzacja tworzenia Structured Properties, tagów, słowników biznesowych i domen w DataHub."
        - "Skrypty ustalające data lineage na podstawie procedur BigQuery/Oracle oraz workflow Informatica."
        - "Workflow GitLab CI/CD konwertujący dokumentację Excel do formatu HTML."
        - "Wewnętrzna strona we Flasku zapewniająca bezpośredni dostęp do dokumentacji obiektów z interfejsu DataHub."
        - "Wdrożenia na klastry GKE przy użyciu Helm Chartów i własnych, utwardzonych obrazów Docker."
        - "Optymalizacja wydajności: partycjonowanie topiców Kafka, sharding indeksów Elasticsearch, strojenie zmiennych środowiskowych."
        - "Sidecar proxy Nginx dla frontendu DataHub naprawiający błędy wyszukiwania poprzez modyfikację zapytań API."
    - title: "Rozwój Apache Superset"
      summary: "Aktualizacja platformy i automatyzacja wdrożeń."
      bullets:
        - "Nowe zadania Ansible automatyzujące wdrażanie wykresów i dashboardów."
        - "Aktualizacja definicji wdrożeniowych zapewniająca płynny update i kompatybilność z nowszymi wersjami."

