# Teksty strony dla wersji polskiej
title: "Data Engineer | GCP · Python · PostgreSQL"
intro: >-
  Data Engineer z ponad 4-letnim doświadczeniem w danych bankowych i korporacyjnych: GCP (BigQuery, GKE),
  Python, PostgreSQL/Oracle i CI/CD. W PKO Banku Polskim współtworzyłem korporacyjną platformę metadanych
  DataHub obejmującą 4 systemy źródłowe i ponad 10 000 obiektów, zaprojektowałem proces alokacji kosztów
  BigQuery (storage i compute) na wszystkie departamenty korzystające z platformy oraz zoptymalizowałem
  framework zasilający dane, przyspieszając wybrane kroki nawet 10-krotnie. Łączę inżynierię danych
  z automatyzacją (Python, Docker/Kubernetes, GitLab CI/CD).
