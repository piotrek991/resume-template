# Teksty strony dla wersji polskiej
title: "Data Engineer · ETL Engineer · Python Developer"
intro: >-
  Specjalista Data & IT z ponad trzyletnim doświadczeniem w budowaniu i optymalizacji ekosystemów danych.
  Łączę inżynierię danych z automatyzacją procesów, zachowując spokój i efektywność pod presją czasu.
  Wdrożyłem korporacyjną platformę DataHub zintegrowaną z metadanymi obiektów z wielu wewnętrznych
  systemów bankowych oraz mechanizm alokacji kosztów w BigQuery umożliwiający precyzyjne rozliczanie
  wydatków chmurowych jednostek biznesowych. Jestem proaktywny, nastawiony na ciągły rozwój i szybko
  adaptuję nowe technologie, by dostarczać realną wartość biznesową.
