title: "Data Engineer | GCP · Python · PostgreSQL"
intro: >-
  Data Engineer with 4+ years of experience in banking and enterprise data, working with GCP (BigQuery, GKE),
  Python, PostgreSQL/Oracle and CI/CD. At PKO Bank Polski I co-built an enterprise DataHub metadata platform
  covering 4 source systems and 10,000+ objects, designed a BigQuery cost-allocation process that charges
  storage and compute to every department using the platform, and optimized a data-loading framework,
  making selected steps up to 10x faster. I connect data engineering with automation, from SQL and
  PL/pgSQL to Python tooling, Docker/Kubernetes deployments and GitLab CI/CD.
